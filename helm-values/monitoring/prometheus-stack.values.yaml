# renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
# chart-version: 91.9.0
# No live Helm release — update procedure: helm template with this file at the
# pinned version above, apply CRDs server-side, kubectl diff, kubectl apply
# (strip helm.sh/hook test resources), then delete orphaned resources.
alertmanager:
  # Dead-man's switch: the always-firing Watchdog alert pings an Uptime Kuma
  # push monitor on hoothoot (outside the cluster) every ~1-2 min; Kuma mails
  # if no ping arrives for 10 min. The push URL (contains the token) lives in
  # the SOPS secret secrets/monitoring/kuma-heartbeat.enc.yaml, mounted via
  # alertmanagerSpec.secrets and read with url_file. All other alerts still
  # go to "null". Lists replace the chart defaults; the remaining config keys
  # (global, inhibit_rules, templates, route defaults) come from the chart.
  config:
    route:
      routes:
      - receiver: kuma-watchdog
        matchers:
        - alertname = "Watchdog"
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1m
    receivers:
    - name: "null"
    - name: kuma-watchdog
      webhook_configs:
      - url_file: /etc/alertmanager/secrets/kuma-heartbeat/watchdog
        send_resolved: false
  alertmanagerSpec:
    secrets:
    - kuma-heartbeat
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: longhorn
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
defaultRules:
  create: true
  rules:
    alertmanager: true
    configReloaders: true
    etcd: false
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sContainerResource: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeControllerManager: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubeProxy: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    kubelet: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
grafana:
  adminPassword: admin
  adminUser: admin
  defaultDashboardsEnabled: true
  deploymentStrategy:
    type: Recreate
  enabled: true
  # OIDC client secret (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET) — SOPS-encrypted
  # in secrets/monitoring/grafana-oidc.enc.yaml, synced by the
  # secrets-monitoring Argo app.
  envFromSecret: grafana-oidc
  grafana.ini:
    server:
      root_url: https://grafana.lunding.xyz
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: 9jzyv8TfimMwuLk0w9BXxkdxK5dUuLJc5ozVIyo7
      scopes: openid profile email
      auth_url: https://auth.j-frost.dk/application/o/authorize/
      token_url: https://auth.j-frost.dk/application/o/token/
      api_url: https://auth.j-frost.dk/application/o/userinfo/
      allow_sign_up: true
      use_pkce: true
      login_attribute_path: preferred_username
      role_attribute_path: contains(groups[*], 'authentik Admins') && 'GrafanaAdmin' || 'Viewer'
      allow_assign_grafana_admin: true
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClassName: longhorn
    type: pvc
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    port: 80
    type: ClusterIP
  sidecar:
    resources:
      limits:
        cpu: 200m
        memory: 384Mi
      requests:
        cpu: 20m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      # one-shot init container writes datasource files before Grafana starts —
      # the runtime reload API 401s (no usable local admin credentials), so a
      # watch sidecar can never hot-reload; datasource changes need a pod restart
      initDatasources: true
      watchMethod: LIST
kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: hoothoot
        static_configs:
          - targets:
              - 192.168.10.53:9100
            labels:
              node: hoothoot
      # rotom (Home Assistant Pi, HAOS) — HA prometheus integration.
      # Bearer token lives in the ha-prometheus-token secret (SOPS:
      # secrets/monitoring/ha-prometheus-token.enc.yaml), mounted via
      # prometheusSpec.secrets below.
      - job_name: rotom
        metrics_path: /api/prometheus
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/secrets/ha-prometheus-token/token
        static_configs:
          - targets:
              - 192.168.10.208:8123
            labels:
              node: rotom
    podMonitorSelectorNilUsesHelmValues: false
    # WAL replay on the Pis + Longhorn is slow (~20-30s per 128MB segment when
    # throttled at 1 CPU), and a few days of crash-looping grows the WAL past
    # what 1h can replay. Give Prometheus up to 4h to start before it is killed.
    maximumStartupDurationSeconds: 14400
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    retention: 15d
    retentionSize: 36GB
    ruleSelectorNilUsesHelmValues: false
    # Mounts the HA bearer token at /etc/prometheus/secrets/ha-prometheus-token/
    # for the rotom scrape job above.
    secrets:
      - ha-prometheus-token
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
          storageClassName: longhorn
prometheus-node-exporter:
  extraArgs:
  - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
  - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi
prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
