# renovate: datasource=helm depName=longhorn registryUrl=https://charts.longhorn.io
# chart-version: 1.13.0
# NOTE: the Argo app is a directory source over this dir — this values file is
# NOT consumed by Argo. Upgrade procedure (sequential minors only!):
#   helm template longhorn longhorn/longhorn --version <ver> -n longhorn-system \
#     -f longhorn.values.yaml
# then split helm hooks: run pre-upgrade Job first, apply main, run post-upgrade
# Job, delete jobs. Exclude the pre-delete (uninstall) hook. Temporarily set
# concurrent-automatic-engine-upgrade-per-node-limit=3 for live engine upgrades.
defaultSettings:
  defaultDataPath: /storage1
  createDefaultDiskLabeledNodes: true
  backupTarget: s3://longhorn@dummyregion/
  backupTargetCredentialSecret: backup-secret
networkPolicies:
  # New in chart 1.12: internal-traffic NetworkPolicies render even with
  # enabled=false. Keep off to preserve pre-1.12 behavior — k3s enforces
  # netpols and the iSCSI data path includes host-originated traffic that
  # these podSelector-only policies could block. Revisit deliberately.
  restrictInternalTraffic: false
csi:
  # Chart default is 3 per sidecar — overkill on a 4-node cluster. These are
  # leader-elected control-plane pods (no data path); 2 keeps one warm standby
  # so attach/provision/resize/snapshot ops fail over instantly on node loss.
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2
longhornGlobalManager:
  # 1 active leader + 1 warm standby (chart default 3).
  replicas: 2
longhornUI:
  # Stateless dashboard; no HA needed (chart default 2).
  replicas: 1
