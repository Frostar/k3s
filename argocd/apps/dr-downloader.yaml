apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dr-downloader
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/Frostar/k3s
    targetRevision: HEAD
    path: apps/dr-downloader
  destination:
    server: https://kubernetes.default.svc
    namespace: dr-downloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
