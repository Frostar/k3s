apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: threadfin-conf
  namespace: threadfin
  labels:
    recurring-job.longhorn.io/daily-backup: enabled
    recurring-job.longhorn.io/weekly-backup: enabled
    recurring-job.longhorn.io/monthly-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
