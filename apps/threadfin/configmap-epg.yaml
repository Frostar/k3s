# XMLTV generator for the DR live channels in threadfin-playlists.
# A sidecar in the threadfin Deployment runs this on a loop; Threadfin
# reads the output from /home/threadfin/epg/dr.xml (shared emptyDir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: threadfin-epg
  namespace: threadfin
data:
  dr_epg.py: |
    #!/usr/bin/env python3
    """Generate XMLTV for DR live channels from DR's public schedules API."""
    import json
    import sys
    import urllib.request
    from datetime import date, datetime, timedelta
    from xml.sax.saxutils import escape, quoteattr

    CHANNELS = {
        "20875": ("DR1.dk", "DR1"),
        "20876": ("DR2.dk", "DR2"),
        "20892": ("DRRamasjang.dk", "DR Ramasjang"),
        "192100": ("DRTVEkstra.dk", "DRTV Ekstra"),
        "192099": ("DRTVA.dk", "TVA Live"),
    }
    API = ("https://production.dr-massive.com/api/schedules"
           "?channels={ids}&date={date}&duration=24&hour=0&device=web_browser&lang=da")
    DAYS = 7


    def fetch(day: date):
        url = API.format(ids=",".join(CHANNELS), date=day.isoformat())
        req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, timeout=60) as r:
            return json.load(r)


    def ts(iso: str) -> str:
        dt = datetime.strptime(iso, "%Y-%m-%dT%H:%M:%SZ")
        return dt.strftime("%Y%m%d%H%M%S +0000")


    def main(out_path: str) -> None:
        seen = set()
        programmes = []
        for offset in range(DAYS):
            for chan in fetch(date.today() + timedelta(days=offset)):
                xmltv_id = CHANNELS[str(chan["channelId"])][0]
                for s in chan.get("schedules", []):
                    key = (xmltv_id, s["startDate"])
                    if key in seen:
                        continue
                    seen.add(key)
                    item = s.get("item", {})
                    prog = [
                        f'  <programme start={quoteattr(ts(s["startDate"]))} '
                        f'stop={quoteattr(ts(s["endDate"]))} channel={quoteattr(xmltv_id)}>',
                        f'    <title lang="da">{escape(item.get("title") or "Ukendt")}</title>',
                    ]
                    if item.get("description"):
                        prog.append(f'    <desc lang="da">{escape(item["description"])}</desc>')
                    prog.append("  </programme>")
                    programmes.append("\n".join(prog))

        lines = ['<?xml version="1.0" encoding="UTF-8"?>',
                 '<tv source-info-name="DR massive API" generator-info-name="dr-epg">']
        for xmltv_id, name in CHANNELS.values():
            lines.append(f"  <channel id={quoteattr(xmltv_id)}>")
            lines.append(f'    <display-name lang="da">{escape(name)}</display-name>')
            lines.append("  </channel>")
        lines.extend(programmes)
        lines.append("</tv>")

        tmp = out_path + ".tmp"
        with open(tmp, "w", encoding="utf-8") as fh:
            fh.write("\n".join(lines) + "\n")
        import os
        os.replace(tmp, out_path)
        print(f"dr-epg: wrote {len(programmes)} programmes to {out_path}")


    if __name__ == "__main__":
        main(sys.argv[1] if len(sys.argv) > 1 else "dr.xml")
