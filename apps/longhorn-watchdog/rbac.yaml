# ServiceAccount for the backup watchdog CronJobs: read-only access to
# Longhorn Backup CRs so it can verify recurring backups completed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-watchdog
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-watchdog
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["backups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-watchdog
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-watchdog
subjects:
  - kind: ServiceAccount
    name: backup-watchdog
    namespace: longhorn-system
