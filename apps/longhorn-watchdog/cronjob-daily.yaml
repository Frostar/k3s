# Verifies the Longhorn daily-backup recurring job (03:00) completed and
# pushes the result to Uptime Kuma. Runs with a 2 h margin for the backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-watchdog-daily
  namespace: longhorn-system
spec:
  schedule: "0 5 * * *"
  timeZone: "Europe/Copenhagen"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: backup-watchdog
          containers:
            - name: watchdog
              image: python:3.14-alpine
              command: ["python3", "/scripts/watchdog.py"]
              env:
                - name: JOB_NAME
                  value: "daily-backup"
                - name: MAX_AGE_HOURS
                  value: "26"
                - name: HEARTBEAT_URL
                  valueFrom:
                    secretKeyRef:
                      name: kuma-heartbeat
                      key: daily
                      optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "250m"
          volumes:
            - name: scripts
              configMap:
                name: backup-watchdog
