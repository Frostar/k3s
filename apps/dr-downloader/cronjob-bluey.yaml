# Daily check for new Bluey episodes on DRTV (dr.dk).
# DR rotates availability; episodes are matched by Danish title against
# TheTVDB (DR's own episode numbering is off by one for Bluey).
# Files below 100 MB (old YouTube rips) are re-downloaded in DR quality.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-downloader-bluey
  namespace: dr-downloader
spec:
  schedule: "0 6 * * *"
  timeZone: "Europe/Copenhagen"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # The NFS share is owned by 3000:3000 and Kubernetes does not apply
          # fsGroup to NFS volumes, so run as the share's owner (the image
          # itself defaults to the DHI nonroot uid 65532).
          securityContext:
            runAsNonRoot: true
            runAsUser: 3000
            runAsGroup: 3000
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: dr-downloader
              image: ghcr.io/frostar/dr-downloader:1.1.0
              env:
                - name: HEARTBEAT_URL
                  valueFrom:
                    secretKeyRef:
                      name: kuma-heartbeat
                      key: bluey
                      optional: true
                - name: DR_SERIES_URL
                  value: "https://www.dr.dk/drtv/serie/bluey_227278"
                - name: NAS_PATH
                  value: "Serier/Bluey"
                - name: MATCH
                  value: "tvdb_da"
                - name: TVDB_SLUG
                  value: "bluey-2018"
                - name: UPGRADE_THRESHOLD_MB
                  value: "100"
                # Titles TVDB has not translated yet fall back to DR's own
                # number (image >= 1.0.3). Only alias titles the job still
                # logs as "no TVDB match" (i.e. DR's number disagrees with
                # TVDB's Danish title at that position); the file is then
                # named with DR's title. Skips do not fail the job; the
                # heartbeat message carries skipped=N.
                # skak: TVDB has the typo "Skakt" for S3E11.
                - name: TITLE_ALIASES
                  value: '{"skak": [3, 11]}'
              volumeMounts:
                - name: media
                  mountPath: /media
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
          volumes:
            - name: media
              nfs:
                server: umbreon.lunding.xyz
                path: /mnt/hdd/jellystorage
