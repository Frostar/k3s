# Daily check for new Pokémon episodes on DRTV (dr.dk).
# Syncs every season DR currently lists (handles S20 -> S21 -> ... rotation).
# Episodes are numbered like TMDB -- the provider Jellyfin's Shows library
# uses -- by matching DR's Danish titles against TMDB's, so episodes DR leaves
# out (S21E21, banned from the dub) are found automatically. Files are named
# with TMDB's English titles in the existing pkmns{N}/'{ee} - {title}' style.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-downloader-pokemon
  namespace: dr-downloader
spec:
  schedule: "30 6 * * *"
  timeZone: "Europe/Copenhagen"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # The NFS share is owned by 3000:3000 and Kubernetes does not apply
          # fsGroup to NFS volumes, so run as the share's owner (the image
          # itself defaults to the DHI nonroot uid 65532).
          securityContext:
            runAsNonRoot: true
            runAsUser: 3000
            runAsGroup: 3000
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: dr-downloader
              image: ghcr.io/frostar/dr-downloader:1.4.0
              env:
                - name: HEARTBEAT_URL
                  valueFrom:
                    secretKeyRef:
                      name: kuma-heartbeat
                      key: pokemon
                      optional: true
                - name: DR_SERIES_URL
                  value: "https://www.dr.dk/drtv/serie/pokemon-_-sol-og-maane_606810"
                - name: NAS_PATH
                  value: "Serier/Pokemon"
                - name: MATCH
                  value: "tmdb"
                - name: TMDB_ID
                  value: "60572"
                - name: TMDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tmdb
                      key: read-access-token
                - name: SEASON_DIR_PATTERN
                  value: "pkmns{N}"
                - name: FILENAME_PATTERN
                  value: "{ee} - {title}"
              volumeMounts:
                - name: media
                  mountPath: /media
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
          volumes:
            - name: media
              nfs:
                server: umbreon.lunding.xyz
                path: /mnt/hdd/jellystorage
