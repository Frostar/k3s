# No Authentik forward-auth: Gramps Web does native OIDC against Authentik
# (app slug "gramps"), with local login disabled.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gramps
  namespace: gramps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: gramps.j-frost.dk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gramps
            port:
              number: 80
  tls:
  - hosts:
    - gramps.j-frost.dk
    secretName: gramps-tls
