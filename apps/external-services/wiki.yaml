# Wiki Ingress
# Service running in wikijs namespace
# ForwardAuth gate + OIDC callback bypass for Wiki.js login

# OIDC callback path — must bypass ForwardAuth to complete the OAuth2 flow
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-oidc-callback
  namespace: wikijs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-security-headers@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - wiki.j-frost.dk
    secretName: wiki-tls
  - hosts:
    - wiki.lunding.xyz
    secretName: wiki-lunding-tls
  rules:
  - host: wiki.j-frost.dk
    http:
      paths:
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: wiki
            port:
              number: 80
  - host: wiki.lunding.xyz
    http:
      paths:
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: wiki
            port:
              number: 80

---
# Main ingress — protected by Authentik ForwardAuth
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki
  namespace: wikijs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-security-headers@kubernetescrd,authentik-authentik@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - wiki.j-frost.dk
    secretName: wiki-tls
  - hosts:
    - wiki.lunding.xyz
    secretName: wiki-lunding-tls
  rules:
  - host: wiki.j-frost.dk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiki
            port:
              number: 80
  - host: wiki.lunding.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiki
            port:
              number: 80

---
# GraphQL API endpoint — bypasses Authentik ForwardAuth (Wiki.js Bearer-token protected).
# Internal hostname only (wiki.lunding.xyz), NOT the public wiki.j-frost.dk.
# Mirrors the /login bypass pattern above. Consumed by the Wiki.js MCP server / automation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-graphql-api
  namespace: wikijs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-security-headers@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - wiki.lunding.xyz
    secretName: wiki-lunding-tls
  rules:
  - host: wiki.lunding.xyz
    http:
      paths:
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: wiki
            port:
              number: 80
