apiVersion: v1
kind: Service
metadata:
  name: wiki
  namespace: wikijs
  labels:
    app.kubernetes.io/instance: wiki
    app.kubernetes.io/name: wiki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: wiki
    app.kubernetes.io/name: wiki
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: https
      port: 443
      protocol: TCP
      targetPort: http
