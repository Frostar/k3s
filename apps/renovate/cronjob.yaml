apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 5 * * *"
  timeZone: "Europe/Copenhagen"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: docker.io/renovate/renovate:44.108.2
              args:
                - bash
                - -c
                - |
                  renovate; rc=$?
                  if [ -n "${HEARTBEAT_URL:-}" ]; then
                    [ "$rc" -eq 0 ] && s=up || s=down
                    curl -fsS -m 30 "${HEARTBEAT_URL}?status=${s}&msg=exit_${rc}" >/dev/null \
                      || echo "warning: heartbeat push failed" >&2
                  fi
                  exit $rc
              env:
                - name: HEARTBEAT_URL
                  valueFrom:
                    secretKeyRef:
                      name: kuma-heartbeat
                      key: renovate
                      optional: true
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-token
                      key: RENOVATE_TOKEN
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-ghcr-hostrules
                      key: RENOVATE_HOST_RULES
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_REPOSITORIES
                  value: '["Frostar/k3s","Frostar/postgre-backup","Frostar/dr-downloader"]'
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@j-frost.dk>"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
