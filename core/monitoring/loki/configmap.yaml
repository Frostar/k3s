apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          endpoint: 192.168.10.246:9000
          region: us-east-1
          bucketnames: loki-chunks
          access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
          secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
          s3forcepathstyle: true
          insecure: true

    schema_config:
      configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    ingester:
      wal:
        enabled: true
        dir: /loki/wal

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: s3

    limits_config:
      # Default retention 30d; auth/security (Authentik) 90d; noisy NAS apps 14d.
      retention_period: 720h
      retention_stream:
        - selector: '{namespace="authentik"}'
          priority: 10
          period: 2160h
        - selector: '{app=~"jellyfin|nextcloud"}'
          priority: 5
          period: 336h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16

    analytics:
      reporting_enabled: false
