apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs
  namespace: monitoring
  labels:
    app: alloy-logs
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // Pod logs — tailed via the Kubernetes API (no /var/log/pods hostPath
    // needed, and immune to the DietPi RAMlog hourly wipe of node disks).
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "(.+)"
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "(.+)"
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }

    // Node logs — systemd journal (volatile /run/log/journal on DietPi RAMlog).
    loki.relabel "journal" {
      forward_to = []
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
    }

    loki.source.journal "node" {
      labels = {
        job  = "journald",
        node = sys.env("NODE_NAME"),
      }
      relabel_rules = loki.relabel.journal.rules
      forward_to    = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
      external_labels = {
        cluster = "k3s",
      }
    }
