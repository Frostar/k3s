apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog
  namespace: monitoring
  labels:
    app: alloy-syslog
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.10.132
spec:
  type: LoadBalancer
  # Local preserves the sender's source IP, which the Alloy config uses to
  # disambiguate the two TrueNAS hosts (both report hostname "truenas").
  externalTrafficPolicy: Local
  selector:
    app: alloy-syslog
  ports:
    - name: syslog-udp
      port: 514
      targetPort: syslog-udp
      protocol: UDP
    - name: syslog-tcp
      port: 514
      targetPort: syslog-tcp
      protocol: TCP
