apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-syslog
  namespace: monitoring
  labels:
    app: alloy-syslog
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    // Receives syslog from espeon + umbreon (TrueNAS native forwarding)
    // and hoothoot (rsyslog) via the MetalLB LoadBalancer 192.168.10.132:514.
    // RFC5424: TrueNAS syslog-ng uses the IETF syslog() destination, and
    // hoothoot's rsyslog forwards with RSYSLOG_SyslogProtocol23Format.
    loki.relabel "syslog" {
      forward_to = []
      rule {
        source_labels = ["__syslog_message_hostname"]
        target_label  = "host"
      }
      // Both TrueNAS boxes report hostname "truenas" — disambiguate by
      // source IP so espeon/umbreon are distinguishable in queries.
      rule {
        source_labels = ["__syslog_connection_ip_address"]
        regex         = "192\\.168\\.10\\.246"
        target_label  = "host"
        replacement   = "espeon"
      }
      rule {
        source_labels = ["__syslog_connection_ip_address"]
        regex         = "192\\.168\\.10\\.249"
        target_label  = "host"
        replacement   = "umbreon"
      }
      // The Home Assistant Pi still reports hostname "homeassistant" until
      // the rotom rename lands — map it by source IP like the NAS boxes.
      rule {
        source_labels = ["__syslog_connection_ip_address"]
        regex         = "192\\.168\\.10\\.208"
        target_label  = "host"
        replacement   = "rotom"
      }
      rule {
        source_labels = ["__syslog_message_app_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__syslog_message_severity"]
        target_label  = "severity"
      }
      rule {
        source_labels = ["__syslog_message_facility"]
        target_label  = "facility"
      }
    }

    loki.source.syslog "external" {
      listener {
        address                = "0.0.0.0:1514"
        protocol               = "udp"
        syslog_format          = "rfc5424"
        use_incoming_timestamp = true
        labels                 = { job = "syslog" }
      }
      listener {
        address                = "0.0.0.0:1601"
        protocol               = "tcp"
        syslog_format          = "rfc5424"
        use_incoming_timestamp = true
        labels                 = { job = "syslog" }
      }
      relabel_rules = loki.relabel.syslog.rules
      forward_to    = [loki.write.default.receiver]
    }

    // Loki push API for the Alloy custom app on each TrueNAS box, which ships
    // Docker container (TrueNAS app) logs read from the local Docker socket.
    // Senders set their own labels (job="docker", host, app, service,
    // container); keep their timestamps so backfilled lines land correctly.
    loki.source.api "nas" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 3500
      }
      use_incoming_timestamp = true
      forward_to             = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
