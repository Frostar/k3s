apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  # Self-managed Corefile (no longer maintained by the k3s addon controller).
  # The bundled k3s Corefile used `hosts /etc/coredns/NodeHosts`, where the
  # NodeHosts key was dynamically injected/maintained by k3s. Since we now own
  # CoreDNS and the cluster nodes have static IPs, the node host entries are
  # inlined below. New/renamed nodes require updating this block.
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts {
          192.168.10.211 kube01
          192.168.10.212 kube02
          192.168.10.213 kube03
          192.168.10.214 kube04
          ttl 60
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . /etc/resolv.conf
    }
    import /etc/coredns/custom/*.server
